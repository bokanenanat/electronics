    .link-1, .link-2, .link-3, .link-4 {

    .link-3 {

    }
    .link-4 {

    .section-nav-B i{
      position: absolute;
      color: var(--cl);
      font-size: clamp(5vw, 3vh, 6vw);
      left: 0;
      top: 0;
      transition: all 0.29s ease;
    }
    .section-nav-B i:hover {
      color: var(--br);
      text-shadow: 0 0 6.5px #44f;
      font-size: 3.25vh;
    }
    @keyframes opacity {
      from { color: var(--br); text-shadow: 0 0 10px var(--br);}
      to { color: #333; text-shadow: 0 0 10px var(--cl);}
    }
    .searcher-B {
      position: fixed;

      z-index: 100000;
      background: var(--bg-1);

    .scroller-B {

    }
    .button-scroll-B::after {

      height: 0;
      width: 100%;
      position: absolute;
      top: 50%;
      left: 0;
      transition: all 1.5s ease;
    }
    .button-scroll-B:hover::after {
      position: absolute;
      top: 0;
      left: 0;
      height: 76vh;
      width: 100%;
      background: rgba(200, 100, 255, 0.2);
