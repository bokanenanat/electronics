<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    body {
      background: #000;
    }
    .bg-C {
      width: 40%;
      max-width: 70vw;
      margin-right: 30%;
      margin-top: 15vh;
      border: none;
      pointer-events: none;
      animation: rotate 15s linear infinite;
      border-radius: 999px;
    }  
    @keyframes rotate {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    .father-C {
      margin-bottom: 6vh;
      min-height: 140vw;
      height: 89vh;
      width: 90%;
      margin-right: 5%;
      margin-top: 15vh;
      background: none;
      border-radius: 30px;
      border: none;
      animation: change-border 6s ease infinite;
      border-top: 1px solid #5af;
      border-bottom: 1px solid #5af;
    }
    @keyframes change-border {
      0% { border-top: 1px solid rgba(255,150,0,1);}
      50% { border-bottom: 1px solid rgba(255,150,0,1);}
      100% { border-top: 1px solid #5af;}
    }
    .input-C {
      width: 80%;
      max-width: 90vw;
      margin-right: 10%;
      height: 10%;
      background: #0f0f0f;
      margin-top: 20%;
      color: #808080;
      outline: none;
      border: 1px solid #333333;
      border-left: 1px solid #acf;
      border-bottom: 1px solid #acf;
    }
    .button-submit-C {
      height: 10%;
      margin-top: 10vh;
      width: 50%;
      margin-right: 25%;
      color: #668;
      background: #aeb;
      border-radius: 5px;
      border: 2px solid #888;
      border-top: none;
      border-right: none;
    }
    .open-link-C {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: none;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <img src="images/month.jpeg" class="bg-C">
  <form class="father-C" action="resultRegister-D">
    <input class="input-C" type="text" placeholder="Enter your full name" required>
    <input class="input-C" type="number" placeholder="Enter your phone numner" required>
    <input class="input-C" type="password" placeholder="Please create a password" required>
    <button type="submit" class="button-submit-C">Register</button>
  </form>
</body>
</html>
