<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOPP</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body{
      user-select: none;
      min-height: 130vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(200deg, #aaaaff, #0a0a0a);
      background-size: 200% 200%;
      animation: gradientShift 8s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 100%; }
      50% { background-position: 50% 20%; }
      100% { background-position: 20% 100%; }
    }
    .father-A {
      border-radius: 10px;
      box-shadow: 0 0 10px #aaf;
      background: none;
      height: 120vh;
      width: 90%;
      border: 1px solid #303030;
      position: relative;
    }
    .header-A {
      margin-top: 8vh;
      border: 2px solid #7777ff;
      width: 86%;
      height: 20vh;
      border-radius: 20px;
      border-left: none;
      border-right: none;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      bx-shadow: 0 -5px 10px #40409f;
      margin-left: 6vw;
    }
    .text-header-A {
      font-family: 'Orbitron', sans-serif;
      white-space: nowrap;
      color: #701010;
      position: relative;
      font-size: 5vh;
      animation: glitch 0.7s infinite, glitch-clip 0.6s infinite, header 20s linear infinite;
      text-shadow: 0 0 3px #47f0af;
    }
    .text-header-A::before {
      animation: glitch 0.8s infinite, glitch-clip 0.7s infinite;
      position: absolute;
      content: attr(text-data);
      font-size: inherit;
      top: 1px;
      left: 1px;
      color: #5010e0;
    }
    .text-header-A::after {
      animation: glitch 0.9s infinite, glitch-clip 0.8s infinite;
      position: absolute;
      left: 2px;
      top: 2px;
      content: attr(text-data);
      font-size: inherit;
      color: #aaaaff;
    }
    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, -3px); }
      80% { transform: translate(2px, 1px); }
    }
    @keyframes glitch-clip {
      0%   { clip-path: inset(0 15% 16% 20%) ;opacity:0.5; }
      20%  { clip-path: inset(2% 0 21% 0); }
      40%  { clip-path: inset(15% 0 3% 0); }
      60%  { clip-path: inset(30% 30% 10% 0); }
      80%  { clip-path: inset(10% 0 8% 42%); }
      100% { clip-path: inset(0 0 12% 0); }
    }
    @keyframes header {
      from { transform: translateX(+73%);}
      to { transform: translateX(-73%);}
    }
    .log-in-A, .sign-up-A{
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      position:relative ;
      background: none;
      height: 12vh;
      width: 50vw;
      border: 2px solid #47f0ff;
      border-radius: 20px;
      top: 35vh;
      left: 18.4vw;
      border-top: none;
      border-bottom: none;
      font-size: 3vh;
      color: #00afaf;
      text-shadow: 0 0 5px #000000;
    }
    .sign-up-A {
      margin-top: 10vh;
    }
    .log-in-A::before,.sign-up-A::before{
      transition: width 0.6s ease;
      position: absolute;
      content: "";
      width: 0;
      height: 0;
      left: 0;
      top: 0;
    }
    .log-in-A:hover::before, .sign-up-A:hover::before{
      content: "";
      background: none;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border-radius: 20px;
      box-shadow: 0 0 10px #29f;
    }
    .button-footer-1-A, .button-footer-2-A, .button-footer-3-A {
      white-space: nowrap;
      bottom: 2vh;
      left: 7vw;
      color: #888;
      font-size: 1.5vh;
      position: absolute;
      width: 5vw;
      background: none;
      border: none;
    }
    .button-footer-2-A {
      left: 35vw;
    }
    .button-footer-3-A {
      left: 67vw;
    }
    .button-footer-1-A:hover, .button-footer-2-A:hover, .button-footer-3-A:hover {
      color: #2ff;
      text-shadow: 0 0 5px #2af;
    }
  </style>
</head>
<body>
  <section class="father-A">
    <header class="header-A">
      <h1 class="text-header-A" text-data="Welcome to Shopping ...">
        Welcome to Shopping ...
      </h1>
    </header>
    <a class="log-in-A" href="Home-B.html">
      Sign Up
    </a>
    <a class="sign-up-A">
      Log In
    </a>
    <button class="button-footer-1-A">
      Help
    </button>
    <button class="button-footer-2-A">
      Projects
    </button>
    <button class="button-footer-3-A">
      About Us
    </button>
  </section>
</body>
</html>
