<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --bg: #03050a;
      --card-bg: rgba(10, 12, 30, 0.6);
      --gold: #ffb800;
      --cyan: #00e5ff;
      --purple: #b347ea;
      --red: #ff1744;
      --green: #00ff41;
      --text: #e0e0f0;
      --text-dim: #8888aa;
      --radius: 24px;
      --border-glow: rgba(255, 184, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      font-family: 'Segoe UI', 'Vazirmatn', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ============ ذرات پس‌زمینه ============ */
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 4s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .nebula {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      animation: drift 20s ease-in-out infinite;
    }

    .nebula:nth-child(1) { width: 500px; height: 500px; background: var(--purple); top: -150px; left: -100px; }
    .nebula:nth-child(2) { width: 400px; height: 400px; background: var(--cyan); bottom: -100px; right: -100px; animation-delay: -10s; }
    .nebula:nth-child(3) { width: 300px; height: 300px; background: var(--gold); top: 40%; left: 60%; animation-delay: -5s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(40px, -30px) scale(1.2); }
      50% { transform: translate(-20px, 20px) scale(0.9); }
      75% { transform: translate(-30px, -10px) scale(1.1); }
    }

    /* ============ کارت اصلی ============ */
    .main-card {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 650px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 40px var(--border-glow);
      text-align: center;
      animation: floatCard 6s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ============ عنوان گلیچ ============ */
    .glitch-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--gold);
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px var(--gold);
    }

    .glitch-title::before,
    .glitch-title::after {
      content: 'پشتیبانی';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.7;
    }

    .glitch-title::before {
      color: var(--cyan);
      animation: glitchBefore 2s infinite;
    }

    .glitch-title::after {
      color: var(--red);
      animation: glitchAfter 2s infinite;
    }

    @keyframes glitchBefore {
      0%, 100% { transform: translate(0); }
      25% { transform: translate(-3px, 2px); }
      50% { transform: translate(3px, -2px); }
      75% { transform: translate(-2px, -3px); }
    }

    @keyframes glitchAfter {
      0%, 100% { transform: translate(0); }
      25% { transform: translate(3px, -2px); }
      50% { transform: translate(-3px, 2px); }
      75% { transform: translate(2px, 3px); }
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 1rem;
      margin-bottom: 2rem;
      letter-spacing: 3px;
    }

    /* ============ دکمه‌های پیام‌رسان ============ */
    .messenger-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2.5rem;
    }

    .messenger-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.2rem 0.8rem;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.03);
      position: relative;
      overflow: hidden;
    }

    .messenger-btn i {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      transition: transform 0.3s;
    }

    .messenger-btn span {
      font-size: 0.9rem;
    }

    .messenger-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    .messenger-btn:hover i {
      transform: scale(1.2);
    }

    /* رنگ‌های اختصاصی هر پیام‌رسان */
    .rubika { border-color: #00bfa5; color: #00bfa5; }
    .rubika:hover { background: #00bfa5; color: #000; box-shadow: 0 0 25px #00bfa5; }

    .telegram { border-color: #0088cc; color: #0088cc; }
    .telegram:hover { background: #0088cc; color: #fff; box-shadow: 0 0 25px #0088cc; }

    .eitaa { border-color: #ff8c00; color: #ff8c00; }
    .eitaa:hover { background: #ff8c00; color: #000; box-shadow: 0 0 25px #ff8c00; }

    .shad { border-color: #8e44ad; color: #8e44ad; }
    .shad:hover { background: #8e44ad; color: #fff; box-shadow: 0 0 25px #8e44ad; }

    .phone { border-color: var(--green); color: var(--green); }
    .phone:hover { background: var(--green); color: #000; box-shadow: 0 0 25px var(--green); }

    .email { border-color: var(--gold); color: var(--gold); grid-column: span 2; }
    .email:hover { background: var(--gold); color: #000; box-shadow: 0 0 25px var(--gold); }

    /* ============ فرم تماس ============ */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }

    .contact-form input,
    .contact-form textarea {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      color: #fff;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--gold);
    }

    .contact-form button {
      background: linear-gradient(135deg, var(--gold), #ff8c00);
      color: #000;
      border: none;
      padding: 0.9rem;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(255,184,0,0.3);
    }

    .contact-form button:hover {
      box-shadow: 0 0 40px rgba(255,184,0,0.6);
      transform: translateY(-2px);
    }

    /* ============ ریسپانسیو ============ */
    @media (max-width: 480px) {
      .main-card { padding: 1.5rem; }
      .glitch-title { font-size: 2rem; }
      .messenger-btn i { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <!-- پس‌زمینه کهکشانی -->
  <div class="stars">
    <div class="nebula"></div>
    <div class="nebula"></div>
    <div class="nebula"></div>
    <div class="star" style="top:10%; left:20%; width:2px; height:2px; animation-delay:0s;"></div>
    <div class="star" style="top:15%; left:70%; width:3px; height:3px; animation-delay:1s;"></div>
    <div class="star" style="top:30%; left:40%; width:2px; height:2px; animation-delay:2s;"></div>
    <div class="star" style="top:50%; left:10%; width:1px; height:1px; animation-delay:0.5s;"></div>
    <div class="star" style="top:60%; left:80%; width:3px; height:3px; animation-delay:1.5s;"></div>
    <div class="star" style="top:75%; left:25%; width:2px; height:2px; animation-delay:2.5s;"></div>
    <div class="star" style="top:85%; left:60%; width:1px; height:1px; animation-delay:3s;"></div>
    <div class="star" style="top:20%; left:90%; width:2px; height:2px; animation-delay:0.8s;"></div>
    <div class="star" style="top:40%; left:50%; width:1px; height:1px; animation-delay:1.8s;"></div>
    <div class="star" style="top:70%; left:45%; width:2px; height:2px; animation-delay:2.2s;"></div>
  </div>

  <!-- کارت اصلی -->
  <main class="main-card">
    <h1 class="glitch-title">پشتیبانی</h1>
    <p class="subtitle">✦ ۲۴ ساعته در کنار شما هستیم ✦</p>

    <!-- دکمه‌های پیام‌رسان -->
    <div class="messenger-grid">
      <a href="https://rubika.ir/your_id" class="messenger-btn rubika" target="_blank">
        <i class="fab fa-rocketchat"></i>
        <span>روبیکا</span>
      </a>
      <a href="https://t.me/your_username" class="messenger-btn telegram" target="_blank">
        <i class="fab fa-telegram-plane"></i>
        <span>تلگرام</span>
      </a>
      <a href="https://eitaa.com/your_id" class="messenger-btn eitaa" target="_blank">
        <i class="fas fa-comment-dots"></i>
        <span>ایتا</span>
      </a>
      <a href="https://shad.ir/your_id" class="messenger-btn shad" target="_blank">
        <i class="fas fa-graduation-cap"></i>
        <span>شاد</span>
      </a>
      <a href="tel:09382174624" class="messenger-btn phone">
        <i class="fas fa-phone-alt"></i>
        <span>تماس</span>
      </a>
      <a href="mailto:Nadimiemail1380@gmail.com" class="messenger-btn email">
        <i class="fas fa-envelope"></i>
        <span>ایمیل</span>
      </a>
    </div>

    <!-- فرم تماس -->
    <form class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
      <input type="text" name="name" placeholder="نام شما" required>
      <input type="email" name="email" placeholder="ایمیل شما" required>
      <textarea name="message" rows="4" placeholder="پیام شما..." required></textarea>
      <button type="submit">🚀 ارسال پیام</button>
    </form>
  </main>
</body>
</html>
